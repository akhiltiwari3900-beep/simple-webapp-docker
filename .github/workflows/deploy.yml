name: My Web App CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check website file
        run: test -f index.html

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/simple-webapp-docker
            git fetch origin main
            git show origin/main:index.html > index.html
            sudo docker build -t simple-webapp .
            sudo docker rm -f simple-webapp-container || true
            sudo docker run -d --name simple-webapp-container -p 80:80 simple-webapp
