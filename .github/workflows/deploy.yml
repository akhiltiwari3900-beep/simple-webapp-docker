
name: My Web App CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check website file
        run: test -f index.html

      - name: Build Docker image
        run: sudo docker build -t simple-webapp .

      - name: Remove old container
        run: sudo docker rm -f simple-webapp-container || true

      - name: Run new container
        run: sudo docker run -d --name simple-webapp-container -p 80:80 simple-webapp
