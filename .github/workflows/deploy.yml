name: Simple Web App CI

on:
  push:
    branches:
      - master
      
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: ls -la

      - name: Build Docker image
        run: docker build -t simple-webapp .