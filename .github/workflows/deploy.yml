name: My Web App CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check website file
        run: test -f index.html

      - name: Build Docker image
        run: docker build -t simple-webapp .
